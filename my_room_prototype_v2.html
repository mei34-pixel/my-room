<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Room ミニ試作品</title>
<style>
:root{--bg:#f6eee3;--panel:#fffaf2;--ink:#594b3e;--muted:#8d7a68;--line:#e7d8c5;--green:#718b65}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:900px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.logo{font-size:22px;font-weight:800}.logo small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.badge{font-size:11px;border-radius:20px;padding:7px 9px;background:#e5eddc;color:#55704b}
.layout{display:grid;grid-template-columns:1.2fr .9fr;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;min-width:0}.panel h2{font-size:15px;margin:0 0 10px}
.board{padding:8px;border-radius:13px;background:#e4dbc4}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;aspect-ratio:1}
.cell{border:1px solid #c4b89d;border-radius:4px;background:#eee4cf;display:grid;place-items:center;padding:0;min-width:0;touch-action:manipulation}.cell:nth-child(even){background:#e8ddc6}.cell .emoji{font-size:clamp(18px,4vw,33px);line-height:1;pointer-events:none}.cell .r90{transform:rotate(90deg)}.cell .r180{transform:rotate(180deg)}.cell .r270{transform:rotate(270deg)}
.hint{font-size:12px;line-height:1.5;color:var(--muted);margin:9px 0 0}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;cursor:pointer;color:var(--ink);background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:9px 10px}button:active{transform:scale(.98)}button.primary{background:var(--green);border-color:var(--green);color:white}
.tabs{display:flex;gap:4px;background:#efe5d7;border-radius:10px;padding:4px;margin-bottom:10px}.tabs button{flex:1;padding:8px 4px;border:0;background:transparent;font-size:12px}.tabs button.active{background:#fffaf2}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px;padding:7px 3px}.item .emoji{font-size:27px}.item .name{font-size:11px}.item.selected{outline:2px solid var(--green);background:#edf3e6}
.colors{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid white;box-shadow:0 0 0 1px var(--line)}.swatch.active{box-shadow:0 0 0 2px var(--green)}
.status{font-size:12px;color:#64815b;min-height:18px;margin-top:8px}.section{margin-top:12px}.section h3{font-size:13px;margin:0 0 8px}
@media(max-width:650px){main{padding:10px}.layout{grid-template-columns:1fr}.panel{padding:11px}.items{grid-template-columns:repeat(4,minmax(0,1fr))}.cell .emoji{font-size:clamp(20px,7vw,34px)}}
</style>
</head>
<body>
<main>
<header><div class="logo">🏡 My Room<small>ちいさなインテリア</small></div><div class="badge">ミニ試作品</div></header>
<div class="layout">
<section class="panel">
<h2>わたしの部屋 <span id="modeText" style="font-size:11px;color:#8d7a68;font-weight:400">· お部屋モード</span></h2>
<div class="board"><div class="grid" id="grid"></div></div>
<div class="controls">
<button class="primary" id="rotate">↻ 回転 0°</button><button id="mode">▧ 箱庭表示</button><button id="undo">↶ 戻す</button><button id="clear">リセット</button>
</div>
<p class="hint">① 下から家具を選ぶ → ② 部屋のマスをタップして配置！ 同じマスを再度タップすると取り除けます。</p>
<div class="status" id="status" aria-live="polite">家具を選んで配置してみてね 🌿</div>
</section>
<section class="panel">
<h2>家具を選ぶ</h2>
<div class="tabs"><button class="active" data-tab="all">すべて</button><button data-tab="furniture">家具</button><button data-tab="plants">小物・植物</button></div>
<div class="items" id="items"></div>
<div class="section"><h3>床の色</h3><div class="colors">
<button class="swatch active" data-color="#eee4cf" style="background:#eee4cf" aria-label="クリーム"></button>
<button class="swatch" data-color="#d7c0a0" style="background:#d7c0a0" aria-label="木目"></button>
<button class="swatch" data-color="#e4d8e8" style="background:#e4d8e8" aria-label="ラベンダー"></button>
<button class="swatch" data-color="#d8e4d2" style="background:#d8e4d2" aria-label="セージ"></button>
<button class="swatch" data-color="#d8e6eb" style="background:#d8e6eb" aria-label="ブルー"></button>
</div></div>
<div class="section"><h3>時間帯</h3><div class="controls" style="margin-top:0"><button id="day" class="primary">☀️ 昼</button><button id="night">🌙 夜</button></div></div>
<div class="section"><button id="save" class="primary">♡ お気に入りに保存</button><button id="image">画像として保存</button></div>
</section>
</div>
<p class="hint">試作品です。3D表示・本物のホーム画面ウィジェットはまだありません。部屋の画像保存はブラウザの機能に対応している場合に利用できます。</p>
</main>
<script>
(function(){
const furniture=[
['ベッド','🛏️','furniture'],['ソファ','🛋️','furniture'],['いす','🪑','furniture'],['テーブル','🪵','furniture'],['本棚','📚','furniture'],['ランプ','💡','furniture'],
['観葉植物','🪴','plants'],['お花','🌷','plants'],['本','📕','plants'],['マグカップ','☕','plants'],['ラグ','🟫','plants'],['ねこ置物','🐈','plants']
];
let selected=0, rotation=0, tab='all', mode='room', night=false, floor='#eee4cf';
let cells=Array(36).fill(null), history=[];
const $=id=>document.getElementById(id);
function say(t){$('status').textContent=t}
function renderItems(){
 const root=$('items');root.replaceChildren();
 furniture.forEach((f,i)=>{
  if(tab!=='all'&&tab!==f[2])return;
  const b=document.createElement('button');b.className='item'+(selected===i?' selected':'');
  const e=document.createElement('span');e.className='emoji';e.textContent=f[1];
  const n=document.createElement('span');n.className='name';n.textContent=f[0];
  b.append(e,n);b.addEventListener('click',()=>{selected=i;renderItems();say(f[0]+'を選択中')});root.appendChild(b);
 });
}
function renderGrid(){
 const root=$('grid');root.replaceChildren();
 cells.forEach((it,i)=>{
  const b=document.createElement('button');b.className='cell';b.style.backgroundColor=floor;
  if(night)b.style.filter='brightness(.72) saturate(.9)';
  if(it){const e=document.createElement('span');e.className='emoji '+(it.r===90?'r90':it.r===180?'r180':it.r===270?'r270':'');e.textContent=it.emoji;b.appendChild(e)}
  b.setAttribute('aria-label','マス '+(i+1));
  b.addEventListener('click',()=>{
   history.push(cells.map(x=>x?{...x}:null));
   if(cells[i]){cells[i]=null;say('家具を取り除きました')}
   else{cells[i]={emoji:furniture[selected][1],name:furniture[selected][0],r:rotation};say(furniture[selected][0]+'を置きました')}
   renderGrid();
  });
  root.appendChild(b);
 });
 $('modeText').textContent='· '+(mode==='room'?'お部屋モード':'箱庭モード');
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderItems()}));
$('rotate').addEventListener('click',()=>{rotation=(rotation+90)%360;$('rotate').textContent='↻ 回転 '+rotation+'°';say('次に置く家具の向き：'+rotation+'°')});
$('mode').addEventListener('click',()=>{mode=mode==='room'?'doll':'room';$('mode').textContent=mode==='room'?'▧ 箱庭表示':'▣ お部屋表示';renderGrid()});
$('undo').addEventListener('click',()=>{if(history.length){cells=history.pop();renderGrid();say('ひとつ前に戻しました')}else say('戻せる操作がありません')});
$('clear').addEventListener('click',()=>{if(confirm('部屋をリセットする？')){history.push(cells.map(x=>x?{...x}:null));cells=Array(36).fill(null);renderGrid();say('リセットしました')}});
document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{floor=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x===b));renderGrid();say('床の色を変更しました')}));
$('day').addEventListener('click',()=>{night=false;$('day').classList.add('primary');$('night').classList.remove('primary');renderGrid();say('昼の雰囲気にしました')});
$('night').addEventListener('click',()=>{night=true;$('night').classList.add('primary');$('day').classList.remove('primary');renderGrid();say('夜の雰囲気にしました')});
$('save').addEventListener('click',()=>{say('♡ お気に入りに保存しました（この試作品内）');$('save').textContent='♥ 保存済み'});
$('image').addEventListener('click',()=>{
 const c=document.createElement('canvas');c.width=720;c.height=760;const ctx=c.getContext('2d');ctx.fillStyle=floor;ctx.fillRect(0,0,720,720);
 for(let i=0;i<36;i++){let x=i%6*120,y=Math.floor(i/6)*120;ctx.strokeStyle='#c4b89d';ctx.strokeRect(x,y,120,120);if(cells[i]){ctx.font='64px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(cells[i].emoji,x+60,y+60)}}
 ctx.fillStyle='#594b3e';ctx.font='bold 26px sans-serif';ctx.fillText('My Room',18,748);
 const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='my-room.png';a.click();say('画像を保存しました');
});
renderItems();renderGrid();
})();
</script>
</body>
</html>
