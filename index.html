<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Room — Cozy Furniture Studio</title>
<style>
:root{--bg:#f5eee2;--paper:#fffaf2;--ink:#594d40;--muted:#8f806d;--line:#e7d9c4;--green:#7e9270;--green2:#e7eddf;--floor:#e9e0ca;--cell:#f0e8d6;--edge:#c9bda5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
main{max-width:760px;margin:auto;padding:22px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px;gap:12px}
h1{font-size:27px;line-height:1.1;margin:0;font-weight:850;letter-spacing:-.5px}header p{margin:7px 0 0;color:var(--muted);font-size:13px}
.pill{background:var(--green2);color:#687b5c;padding:9px 12px;border-radius:99px;font-size:12px;white-space:nowrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:16px;box-shadow:0 5px 18px #816b4510}
h2{font-size:18px;margin:0 0 5px} .sub{font-size:12px;color:var(--muted);margin:0 0 14px}
#room{width:100%;display:block;background:var(--floor);border-radius:20px;touch-action:manipulation}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;color:var(--ink);border:1px solid var(--line);background:#fffdf8;border-radius:15px;padding:11px 14px;min-height:43px;cursor:pointer}
button.primary{background:var(--green);border-color:var(--green);color:white}
button:active{transform:scale(.98)}
.status{font-size:12px;color:var(--green);min-height:18px;margin:10px 0 0}
.tabs{display:flex;gap:7px;margin:10px 0 12px}
.tab{flex:1;font-size:12px;padding:10px 5px}.tab.active{background:var(--green2);border-color:#d7e0cd;color:#536b48}
.furniture{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.item{padding:9px 6px 10px;min-width:0;text-align:center;border-radius:16px;background:#fffdf8}
.item.selected{outline:2px solid var(--green);background:#f1f5eb}
.item svg{width:100%;height:66px;display:block;margin:auto}
.item b{font-size:12px;display:block;margin-top:3px}.item small{font-size:10px;color:var(--muted)}
.colors{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--green)}
.note{font-size:12px;line-height:1.7;color:var(--muted);margin:10px 0 0}
footer{text-align:center;font-size:11px;color:#a99a85;margin:18px}
@media(min-width:620px){.furniture{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding-top:28px}}
</style>
</head>
<body><main>
<header><div><h1>🏡 My Room</h1><p>ちいさなインテリア · Cozy Furniture Studio</p></div><span class="pill">家具デザイン 第2版</span></header>
<section class="panel">
<h2>わたしの部屋</h2><p class="sub">家具を選んで、マスをタップして配置しよう</p>
<canvas id="room" width="600" height="600" aria-label="部屋のマス目"></canvas>
<div class="controls">
<button class="primary" id="rotate">↻ 回転 <span id="deg">0°</span></button>
<button id="doll">▧ 箱庭表示</button><button id="undo">↶ 戻す</button><button id="reset">リセット</button>
</div><p class="status" id="status">家具を選ぶと、部屋に配置できます。</p>
<p class="note">同じマスをもう一度タップすると家具を取り除けます。家具はオリジナルの簡易ローポリ風イラストで描画しています。</p>
</section>
<section class="panel">
<h2>家具を選ぶ</h2><p class="sub">あたたかい木目と、やさしい色合い</p>
<div class="tabs"><button class="tab active" data-cat="all">すべて</button><button class="tab" data-cat="furniture">家具</button><button class="tab" data-cat="plants">小物・植物</button></div>
<div class="furniture" id="items"></div>
</section>
<section class="panel">
<h2>床の色</h2><p class="sub">部屋の雰囲気を変えてみよう</p><div class="colors" id="colors"></div>
<div class="controls"><button id="save">♡ お気に入り画像を保存</button><button id="day">☀ 昼 / 夜</button></div>
<p class="note">保存ボタンで部屋の画像をダウンロードできます。ホーム画面ウィジェットへの反映は、この試作品では未対応です。</p>
</section>
<footer>My Room · tiny spaces, warm places</footer>
</main>
<script>
const NS='http://www.w3.org/2000/svg';
const types=[
{id:'sofa',name:'ソファ',cat:'furniture',colors:['#8ba9bd','#6d8fa6','#b8ced8']},
{id:'bed',name:'ベッド',cat:'furniture',colors:['#b8c9d0','#8eabb7','#e8e3d8']},
{id:'chair',name:'木のいす',cat:'furniture',colors:['#b9825e','#8e6047','#d2a17d']},
{id:'table',name:'テーブル',cat:'furniture',colors:['#c99b70','#986b4c','#dfbd92']},
{id:'lamp',name:'テーブルランプ',cat:'furniture',colors:['#e8c77d','#b58d54','#fff0c3']},
{id:'shelf',name:'本棚',cat:'furniture',colors:['#bd8d64','#8e6347','#d5b18c']},
{id:'plant',name:'観葉植物',cat:'plants',colors:['#78946c','#557653','#9eb58b']},
{id:'flower',name:'お花',cat:'plants',colors:['#dba0a0','#8eaa72','#f0d5c6']},
{id:'rug',name:'ラグ',cat:'plants',colors:['#d5b7a2','#b68f78','#ead9c5']},
{id:'clock',name:'壁かけ時計',cat:'plants',colors:['#d6c29e','#a88f68','#fff4d8']},
{id:'plant2',name:'小さな鉢植え',cat:'plants',colors:['#7d9a71','#587957','#c98e72']},
{id:'stool',name:'スツール',cat:'furniture',colors:['#c99a6f','#946746','#dfbd92']}
];
let selected='sofa',rotation=0,doll=false,night=false,placements=[],history=[],floor='#e9e0ca',activeCat='all';
const canvas=document.getElementById('room'),ctx=canvas.getContext('2d'),status=document.getElementById('status');
const swatches=['#e9e0ca','#e6d7c8','#dfe5d5','#d8e3e8','#e8d7e0'];
function polygon(points,fill,stroke='#8d785f',lw=1.5){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.stroke()}
function rect(x,y,w,h,fill,stroke='#8d785f',lw=1.5){ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.beginPath();ctx.roundRect(x,y,w,h,4);ctx.fill();ctx.stroke()}
function line(x1,y1,x2,y2,color='#8d785f',w=2){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawFurniture(id,x,y,size=1,rot=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(rot*Math.PI/180);ctx.scale(size,size);
 const wood='#b9825e',dark='#8e6047',light='#d7ad87',shadow='#c6b79a';
 if(id==='sofa'){
  polygon([[-24,10],[-18,20],[18,20],[24,10]],'#6d8fa6');rect(-25,-8,50,22,'#8ba9bd');rect(-28,-7,10,22,'#7899ae');rect(18,-7,10,22,'#7899ae');rect(-18,-13,17,15,'#a9c0ce','#6d8fa6');rect(1,-13,17,15,'#a9c0ce','#6d8fa6');line(-17,20,-17,25,dark,3);line(17,20,17,25,dark,3)
 }else if(id==='bed'){
  rect(-25,-7,50,22,'#b9825e');rect(-21,-4,42,14,'#8eabb7','#6f8990');rect(-20,-8,15,8,'#f8f1df','#c9bda5');polygon([[-25,-7],[-25,-17],[-20,-17],[-20,-7]],wood);polygon([[20,-7],[20,-17],[25,-17],[25,-7]],wood);line(-17,15,-17,22,dark,3);line(17,15,17,22,dark,3)
 }else if(id==='chair'||id==='stool'){
  if(id==='chair'){polygon([[-15,-9],[-15,-27],[-10,-27],[-8,-9]],wood);line(-13,-20,12,-20,light,2)}
  polygon([[-17,-9],[17,-9],[13,-2],[-13,-2]],light);polygon([[-17,-9],[13,-2],[13,2],[-17,-5]],wood);line(-12,0,-14,20,dark,3);line(12,0,14,20,dark,3);line(-12,8,12,8,wood,2)
 }else if(id==='table'){
  polygon([[-27,-5],[0,-15],[27,-5],[0,5]],'#dfbd92');polygon([[-27,-5],[0,5],[0,12],[-27,2]],'#b9825e');polygon([[0,5],[27,-5],[27,2],[0,12]],'#986b4c');line(-19,2,-19,19,dark,3);line(18,2,18,19,dark,3)
 }else if(id==='lamp'){
  line(0,2,0,19,dark,3);polygon([[-9,1],[9,1],[6,5],[-6,5]],wood);polygon([[-13,-15],[13,-15],[7,-1],[-7,-1]],'#fff0c3','#c6a96d');line(-8,-10,8,-10,'#f3d88f',1)
 }else if(id==='shelf'){
  rect(-20,-27,40,52,'#bd8d64');rect(-15,-21,30,12,'#f3e6d2');rect(-15,-3,30,12,'#f3e6d2');rect(-15,15,30,5,'#f3e6d2');rect(-12,-19,5,8,'#8ba9bd','none',0);rect(-4,-19,7,8,'#dba0a0','none',0);rect(6,-19,6,8,'#78946c','none',0);rect(-8,0,6,9,'#d6c29e','none',0);rect(1,0,9,9,'#8ba9bd','none',0)
 }else if(id==='plant'||id==='plant2'){
  line(0,4,0,-19,'#557653',3);line(0,-8,-12,-17,'#557653',2);line(0,-11,12,-22,'#557653',2);polygon([[-2,-17],[-14,-24],[-11,-12],[0,-7]],'#78946c','#557653');polygon([[2,-15],[15,-28],[13,-13],[1,-7]],'#9eb58b','#557653');polygon([[-4,-25],[-1,-35],[5,-24],[2,-15]],'#78946c','#557653');polygon([[-14,4],[14,4],[10,17],[-10,17]],'#c98e72');polygon([[-14,4],[0,8],[0,18],[-10,17]],'#b77a60')
 }else if(id==='flower'){
  line(0,4,0,-19,'#78946c',2);line(0,-7,-8,-13,'#78946c',2);polygon([[-3,2],[3,2],[6,15],[-6,15]],'#c98e72');for(let a=0;a<5;a++){let ang=a*Math.PI*2/5;ctx.beginPath();ctx.ellipse(Math.cos(ang)*6,-22+Math.sin(ang)*6,4,5,ang,0,Math.PI*2);ctx.fillStyle='#dba0a0';ctx.fill();ctx.strokeStyle='#b98282';ctx.stroke()}ctx.beginPath();ctx.arc(0,-22,3,0,Math.PI*2);ctx.fillStyle='#e8c77d';ctx.fill()
 }else if(id==='rug'){
  polygon([[-26,0],[0,-12],[26,0],[0,12]],'#d5b7a2','#b68f78');polygon([[-18,0],[0,-8],[18,0],[0,8]],'#ead9c5','#c8a891');line(-8,0,8,0,'#b68f78',1)
 }else if(id==='clock'){
  line(0,-23,0,-17,dark,2);ctx.beginPath();ctx.arc(0,-5,15,0,Math.PI*2);ctx.fillStyle='#fff4d8';ctx.fill();ctx.strokeStyle='#a88f68';ctx.lineWidth=3;ctx.stroke();line(0,-5,0,-14,'#8d785f',2);line(0,-5,7,-1,'#8d785f',2)
 }
 ctx.restore()
}
function draw(){
 const W=600,H=600,cell=110,gap=6,start=14;
 ctx.clearRect(0,0,W,H);ctx.fillStyle=night?'#c9c8b6':floor;ctx.fillRect(0,0,W,H);
 if(doll){polygon([[12,110],[300,18],[588,110],[300,205]],night?'#d5d1c2':'#f1e8d4','#c4b89f',2);polygon([[12,110],[300,205],[300,588],[12,495]],night?'#c1c1ad':'#e7d8c0','#c4b89f',2);polygon([[300,205],[588,110],[588,495],[300,588]],night?'#d2cbb8':'#e4d2b8','#c4b89f',2);
  for(let i=0;i<=6;i++){let xx=12+i*48;line(xx,110+(xx-12)*.33,xx,495+(xx-12)*.0,'#c8b99e',.8)}
  placements.forEach(p=>{let x=300+(p.c-p.r)*24,y=205+(p.c+p.r)*16;drawFurniture(p.id,x,y,0.75,p.rot)});return;
 }
 for(let r=0;r<5;r++)for(let c=0;c<5;c++){let x=start+c*(cell+gap),y=start+r*(cell+gap);ctx.fillStyle=night?'#ddd8c7':'#f0e8d6';ctx.strokeStyle='#c9bda5';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,cell,cell,8);ctx.fill();ctx.stroke()}
 placements.forEach(p=>{let x=start+p.c*(cell+gap)+cell/2,y=start+p.r*(cell+gap)+cell/2;drawFurniture(p.id,x,y,1,p.rot)})
}
function snapshot(){history.push(JSON.stringify({placements,floor,rotation,doll,night}));if(history.length>30)history.shift()}
function setStatus(s){status.textContent=s}
function choose(id){selected=id;renderItems();setStatus(types.find(t=>t.id===id).name+'を選びました。部屋のマスをタップして配置！')}
function renderItems(){const root=document.getElementById('items');root.innerHTML='';types.filter(t=>activeCat==='all'||t.cat===activeCat).forEach(t=>{const b=document.createElement('button');b.className='item'+(selected===t.id?' selected':'');b.innerHTML=`${iconSvg(t.id)}<b>${t.name}</b><small>タップして選択</small>`;b.onclick=()=>choose(t.id);root.appendChild(b)})}
function iconSvg(id){return `<svg viewBox="0 -42 80 84" aria-hidden="true"><g transform="translate(40 0) scale(.8)">${svgShape(id)}</g></svg>`}
function svgShape(id){const map={sofa:'<rect x="-26" y="-8" width="52" height="25" rx="5" fill="#8ba9bd" stroke="#6d8fa6" stroke-width="2"/><rect x="-20" y="-17" width="18" height="17" rx="4" fill="#b8ced8" stroke="#6d8fa6"/><rect x="2" y="-17" width="18" height="17" rx="4" fill="#b8ced8" stroke="#6d8fa6"/><rect x="-30" y="-8" width="9" height="26" rx="3" fill="#7899ae"/><rect x="21" y="-8" width="9" height="26" rx="3" fill="#7899ae"/><path d="M-18 17v8M18 17v8" stroke="#8e6047" stroke-width="4"/>',bed:'<rect x="-25" y="-5" width="50" height="21" rx="3" fill="#b9825e"/><rect x="-20" y="-10" width="40" height="19" rx="3" fill="#8eabb7"/><rect x="-20" y="-10" width="15" height="8" rx="3" fill="#fff4df"/><path d="M-24-5v-18h5v18M19-5v-18h5v18" fill="#b9825e" stroke="#8e6047" stroke-width="2"/>',chair:'<path d="M-14-6v-27h6v23M-15-5h30v8h-30z" fill="#b9825e" stroke="#8e6047" stroke-width="2"/><path d="M-12 3l-2 23M12 3l2 23" stroke="#8e6047" stroke-width="4"/>',table:'<path d="M-28-5L0-17 28-5 0 7z" fill="#dfbd92" stroke="#986b4c" stroke-width="2"/><path d="M-20 1v22M20 1v22" stroke="#986b4c" stroke-width="4"/>',lamp:'<path d="M-13-25h26l-6 16H-7z" fill="#fff0c3" stroke="#c6a96d" stroke-width="2"/><path d="M0-9v30M-9 21h18" stroke="#8e6047" stroke-width="3"/>',shelf:'<rect x="-20" y="-30" width="40" height="58" rx="2" fill="#bd8d64" stroke="#8e6047" stroke-width="2"/><path d="M-16-10h32M-16 8h32" stroke="#f3e6d2" stroke-width="4"/><path d="M-10-25v12M0-25v12M10-25v12" stroke="#8ba9bd" stroke-width="5"/>',plant:'<path d="M0 5V-20M0-8L-13-22M0-13L13-27" stroke="#557653" stroke-width="3"/><path d="M0-13Q-20-9-16-28Q-3-29 0-13M2-17Q20-12 16-33Q5-32 2-17M-3-25Q-7-40 3-39Q10-30-3-25" fill="#78946c" stroke="#557653" stroke-width="2"/><path d="M-13 5h26l-4 18H-9z" fill="#c98e72" stroke="#b77a60" stroke-width="2"/>',plant2:'<path d="M0 5V-20M0-8L-13-22M0-13L13-27" stroke="#557653" stroke-width="3"/><path d="M0-13Q-20-9-16-28Q-3-29 0-13M2-17Q20-12 16-33Q5-32 2-17" fill="#9eb58b" stroke="#557653" stroke-width="2"/><path d="M-13 5h26l-4 18H-9z" fill="#c98e72" stroke="#b77a60" stroke-width="2"/>',flower:'<path d="M0 4v-24" stroke="#78946c" stroke-width="3"/><g fill="#dba0a0" stroke="#b98282"><ellipse cx="0" cy="-27" rx="5" ry="8"/><ellipse cx="0" cy="-27" rx="5" ry="8" transform="rotate(72 0 -21)"/><ellipse cx="0" cy="-27" rx="5" ry="8" transform="rotate(144 0 -21)"/><ellipse cx="0" cy="-27" rx="5" ry="8" transform="rotate(216 0 -21)"/><ellipse cx="0" cy="-27" rx="5" ry="8" transform="rotate(288 0 -21)"/></g><circle cy="-21" r="4" fill="#e8c77d"/><path d="M-12 4h24l-4 18H-8z" fill="#c98e72"/>',rug:'<path d="M-30 0L0-14 30 0 0 14z" fill="#d5b7a2" stroke="#b68f78" stroke-width="2"/><path d="M-20 0L0-9 20 0 0 9z" fill="#ead9c5" stroke="#b68f78"/>',clock:'<circle cy="-7" r="17" fill="#fff4d8" stroke="#a88f68" stroke-width="3"/><path d="M0-7v-10M0-7l8 5" stroke="#8d785f" stroke-width="2"/><path d="M0-24v-6" stroke="#8d785f" stroke-width="2"/>',stool:'<path d="M-17-5L0-13 17-5 0 3z" fill="#dfbd92" stroke="#986b4c" stroke-width="2"/><path d="M-12 1l-2 22M12 1l2 22" stroke="#8e6047" stroke-width="4"/>'};return map[id]||map.chair}
canvas.addEventListener('click',e=>{const b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)*canvas.width/b.width,y=(e.clientY-b.top)*canvas.height/b.height;if(doll){setStatus('箱庭表示中です。「箱庭表示」を押すとマス目に戻れます。');return}const start=14,cell=110,gap=6,c=Math.floor((x-start)/(cell+gap)),r=Math.floor((y-start)/(cell+gap));if(c<0||c>=5||r<0||r>=5)return;const idx=placements.findIndex(p=>p.r===r&&p.c===c);snapshot();if(idx>=0){placements.splice(idx,1);setStatus('家具を取り除きました。')}else{placements.push({id:selected,r,c,rot:rotation});setStatus(types.find(t=>t.id===selected).name+'を置きました！')}draw()});
document.getElementById('rotate').onclick=()=>{rotation=(rotation+90)%360;document.getElementById('deg').textContent=rotation+'°';setStatus('次に置く家具の向きを変更しました。')};
document.getElementById('doll').onclick=()=>{doll=!doll;document.getElementById('doll').textContent=doll?'▦ マス目表示':'▧ 箱庭表示';draw()};
document.getElementById('undo').onclick=()=>{if(!history.length){setStatus('戻せる操作がありません。');return}let s=JSON.parse(history.pop());placements=s.placements;floor=s.floor;rotation=s.rotation;doll=s.doll;night=s.night;document.getElementById('deg').textContent=rotation+'°';draw();setStatus('ひとつ前に戻しました。')};
document.getElementById('reset').onclick=()=>{snapshot();placements=[];draw();setStatus('部屋をリセットしました。')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderItems()});
const colorRoot=document.getElementById('colors');swatches.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.setAttribute('aria-label','床の色 '+c);b.setAttribute('aria-pressed',c===floor);b.onclick=()=>{snapshot();floor=c;document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};colorRoot.appendChild(b)});
document.getElementById('day').onclick=()=>{night=!night;draw();setStatus(night?'夜の雰囲気にしました。':'昼の雰囲気にしました。')};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='my-room.png';a.href=canvas.toDataURL('image/png');a.click();setStatus('部屋の画像を保存しました！')};
renderItems();draw();
</script></body></html>
